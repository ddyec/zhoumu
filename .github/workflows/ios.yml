name: Build iOS

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      bundle_id:
        description: '主应用 Bundle ID（扩展 ID 自动派生；签名时必须与描述文件匹配）'
        required: true
        default: com.ddyec.zhoumu.ai
        type: string
      signed:
        description: '导出已签名 IPA（需配置证书与四份描述文件 secrets）'
        default: false
        type: boolean
      export_method:
        description: '签名导出方式，必须与证书/描述文件类型一致'
        default: development
        type: choice
        options: [development, ad-hoc, app-store]

permissions:
  contents: read

concurrency:
  group: ios-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 35
    env:
      APP_BUNDLE_ID: ${{ inputs.bundle_id || vars.APP_BUNDLE_ID || 'com.ddyec.zhoumu.ai' }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate bundle ID
        run: |
          python3 - <<'PY'
          import os, re
          value = os.environ['APP_BUNDLE_ID']
          assert re.fullmatch(r'[A-Za-z0-9-]+(?:\.[A-Za-z0-9-]+)+', value), 'Invalid Bundle ID'
          assert value != 'com.zhoumu.weekdisplay', 'Use a Bundle ID distinct from upstream'
          PY
      - name: Check scheduling and SwiftUI
        run: bash Tools/verify.sh
      - name: Check temporary scheduling
        run: |
          swiftc Tools/AssistantCheck/main.swift Shared/SemesterCalculator.swift Shared/ScheduleModel.swift Shared/ScheduleOverride.swift ZhouMu/Models/SchedulePlan.swift -o build/assistant-check
          build/assistant-check
      - name: Check API formats without external requests
        run: |
          swiftc Tools/APIcheck/main.swift Shared/SemesterCalculator.swift Shared/ScheduleModel.swift Shared/ScheduleOverride.swift ZhouMu/Models/SchedulePlan.swift ZhouMu/Models/AIEndpoint.swift ZhouMu/Models/AIClient.swift -o build/api-check
          build/api-check
      - name: Build unsigned IPA
        if: ${{ !inputs.signed }}
        run: |
          set -o pipefail
          xcodebuild -project ZhouMu.xcodeproj -scheme ZhouMu -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build/DerivedData \
            APP_BUNDLE_ID="$APP_BUNDLE_ID" CURRENT_PROJECT_VERSION="$GITHUB_RUN_NUMBER" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY='' build | tee build/xcodebuild.log
          mkdir -p build/ipa/Payload
          cp -R build/DerivedData/Build/Products/Release-iphoneos/ZhouMu.app build/ipa/Payload/
          (cd build/ipa && zip -qry ../ZhouMu-unsigned.ipa Payload)
      - name: Build signed IPA
        if: ${{ inputs.signed }}
        env:
          IOS_CERTIFICATE_P12_BASE64: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          IOS_CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
          IOS_PROFILES_ZIP_BASE64: ${{ secrets.IOS_PROFILES_ZIP_BASE64 }}
          IOS_TEAM_ID: ${{ secrets.IOS_TEAM_ID }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: bash Tools/ci_signed_ipa.sh
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: ZhouMu-${{ inputs.signed && 'signed' || 'unsigned' }}-${{ env.APP_BUNDLE_ID }}
          path: |
            build/*unsigned.ipa
            build/signed/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Upload build log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build/*.log
          if-no-files-found: ignore
      - name: Remove signing material
        if: ${{ always() && inputs.signed }}
        run: |
          security delete-keychain "$RUNNER_TEMP/zhoumu-signing.keychain-db" || true
          rm -rf "$RUNNER_TEMP/zhoumu-signing"
          if [ -f "$RUNNER_TEMP/zhoumu-installed-profiles.txt" ]; then
            while IFS= read -r profile; do rm -f "$HOME/Library/MobileDevice/Provisioning Profiles/$profile.mobileprovision"; done < "$RUNNER_TEMP/zhoumu-installed-profiles.txt"
            rm -f "$RUNNER_TEMP/zhoumu-installed-profiles.txt"
          fi
